name: visionpath
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  shared_preferences: ^2.5.3
  camera: ^0.12.0
  provider: ^6.1.2
  ultralytics_yolo: ^0.6.14
  flutter_tts: ^4.2.5
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_face_detection: ^0.15.1
  tflite_flutter: ^0.12.1
  package_info_plus: ^8.0.0
  vosk_flutter:
    path: third_party/vosk_flutter
  permission_handler: 10.2.0
  flutter_inappwebview: ^6.1.5
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Vendored fixes for plugins that cannot build under this project's AGP 9:
#  - vosk_flutter pins an ancient permission_handler using removed
#    Flutter v1-embedding APIs (so also override permission_handler itself).
#  - flutter_inappwebview_android still calls the removed
#    'proguard-android.txt' keep file.
dependency_overrides:
  permission_handler: 11.3.1
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

flutter:
  uses-material-design: true
  assets:
    # Directory entry (not per-file) so the currency note detector model and its
    # optional label sidecar are bundled the moment they are dropped into
    # assets/ml, without a pubspec edit that would fail the build while the
    # model is still absent.
    #
    # Currency Recognition expects exactly these files (see
    # lib/services/currency_recognition_service.dart and
    # lib/services/currency_detector.dart):
    #   assets/ml/currency_notes_yolo.tflite       YOLOv10n note detector,
    #                                              input [1,640,640,3] float32
    #                                              NHWC RGB /255, output
    #                                              [1,300,6] xyxy(0..1)+conf+cls
    #   assets/ml/currency_notes_yolo_labels.txt   optional, one class per line,
    #                                              order must match the model
    # Face models already in this folder (scrfd_640.tflite etc.) are unrelated
    # and must not be renamed to look like currency models.
    - assets/ml/
    - assets/models/vosk-model-small-en-us-0.15.zip
